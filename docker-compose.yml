services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freelancdeutsch_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - postgres
      - redis
    networks:
      - freelancdeutsch

  nginx:
    image: nginx:alpine
    container_name: freelancdeutsch_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - freelancdeutsch

  postgres:
    image: postgres:17-alpine
    container_name: freelancdeutsch_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - freelancdeutsch

  redis:
    image: redis:7-alpine
    container_name: freelancdeutsch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - freelancdeutsch

networks:
  freelancdeutsch:
    driver: bridge

volumes:
  pgdata:
